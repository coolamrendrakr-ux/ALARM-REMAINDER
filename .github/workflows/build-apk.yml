name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip project
        run: unzip -o -q jaago-alarm-app.zip

      - name: Install packages
        working-directory: jaago
        run: npm install

      - name: Set up Android project
        working-directory: jaago
        run: |
          node scripts/patch-android.js
          npx cap sync android

      - name: Build debug APK
        working-directory: jaago/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jaago-apk
          path: jaago/android/app/build/outputs/apk/debug/app-debug.apk
